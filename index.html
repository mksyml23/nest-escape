<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEST ESCAPE: After Hours</title>
  <style>
    :root { color-scheme: dark; --ink:#161a35; --cream:#fff5d8; --violet:#7d5cff; --pink:#ff5d9e; --aqua:#4ee7db; --gold:#ffd34e; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; overflow:hidden; background:radial-gradient(circle at 50% 0%, #37347a, #101229 60%); font-family: ui-rounded, "Trebuchet MS", system-ui, sans-serif; color:var(--cream); }
    main { width:min(960px, 100vw); height:min(600px, 100vh); position:relative; overflow:hidden; border:5px solid #ffffff33; border-radius:24px; background:linear-gradient(#302c6c 0 58%, #1d1d43 58%); box-shadow:0 24px 80px #0009; }
    .stars { position:absolute; inset:0; opacity:.4; background-image:radial-gradient(white 1px, transparent 1px); background-size:42px 42px; }
    header { position:absolute; z-index:3; inset:20px 24px auto; display:flex; align-items:flex-start; justify-content:space-between; gap:12px; }
    h1 { margin:0; font-size:clamp(22px,4vw,38px); letter-spacing:1px; text-shadow:3px 3px 0 var(--pink); }
    .sub { margin:4px 0 0; color:#d9d5ff; font-size:14px; }
    .status { background:#101229bb; border:2px solid #ffffff33; border-radius:999px; padding:9px 13px; font-size:13px; text-align:right; }
    #room { position:absolute; inset:0; }
    .floor { position:absolute; left:0; right:0; bottom:0; height:42%; background:repeating-linear-gradient(90deg, #29265c 0 46px, #252252 46px 92px); border-top:5px solid #5a55b2; }
    .floor::after { content:""; position:absolute; inset:0; background:repeating-linear-gradient(0deg, transparent 0 42px, #1b1944 42px 46px); opacity:.9; }
    .machine { position:absolute; width:180px; height:245px; left:15%; bottom:20%; z-index:1; border:8px solid #ff8ebc; border-radius:22px 22px 12px 12px; background:linear-gradient(135deg,#7ef3ee,#4b5dd7 58%,#5a3098); box-shadow:inset 0 0 0 6px #1a245b, 0 12px 0 #101229; }
    .machine::before { content:"CLAW\A CHAOS"; white-space:pre; position:absolute; inset:20px 15px auto; height:112px; display:grid; place-items:center; text-align:center; font-size:24px; line-height:.9; font-weight:900; color:#fff; background:#1c255f; border:4px solid #b6fff8; border-radius:10px; }
    .claw { position:absolute; width:6px; height:74px; top:131px; left:83px; background:#ffe66d; transform-origin:top; animation:swing 2.4s ease-in-out infinite; }
    .claw::after { content:"⌄"; position:absolute; bottom:-19px; left:-11px; color:#ffe66d; font-size:34px; font-weight:900; }
    @keyframes swing { 50% { transform:rotate(23deg); } }
    .door { position:absolute; width:150px; height:245px; right:12%; bottom:20%; z-index:1; border:8px solid #ffd34e; border-radius:15px 15px 5px 5px; background:linear-gradient(90deg,#ff6b9a,#b741a7); box-shadow:0 12px 0 #101229; }
    .door::before { content:"EXIT"; position:absolute; top:16px; left:50%; transform:translateX(-50%); font-weight:900; font-size:25px; color:var(--cream); letter-spacing:2px; }
    .door::after { content:"↗"; position:absolute; left:50%; bottom:50px; transform:translateX(-50%); font-size:60px; color:#ffe66d; }
    #player { position:absolute; z-index:2; width:46px; height:58px; left:7%; bottom:22%; transition:filter .15s; }
    #player .head { width:36px; height:32px; margin:auto; border-radius:50% 50% 45% 45%; background:#ffca9b; border:4px solid var(--ink); }
    #player .body { width:44px; height:30px; margin:-2px auto 0; border-radius:16px 16px 8px 8px; background:var(--aqua); border:4px solid var(--ink); }
    .bubble { position:absolute; z-index:4; left:50%; bottom:26px; transform:translateX(-50%); width:min(560px,92%); padding:12px 18px; border-radius:16px; text-align:center; font-weight:700; background:#101229dd; border:2px solid #ffffff33; }
    .help { position:absolute; z-index:4; left:24px; bottom:22px; font-size:13px; color:#dedbff; }
    .restart { position:absolute; z-index:5; right:24px; bottom:20px; border:0; padding:10px 14px; border-radius:12px; cursor:pointer; color:var(--ink); background:var(--gold); font-weight:900; }
    .won { position:absolute; z-index:7; inset:0; display:none; place-items:center; background:#101229d9; text-align:center; padding:30px; }
    .won.show { display:grid; }
    .card { max-width:520px; padding:34px; border:5px solid var(--gold); border-radius:26px; background:linear-gradient(135deg,#6747c9,#ed5793); box-shadow:0 18px 0 #17142f; }
    .card h2 { margin:0 0 10px; font-size:42px; }
    .card p { margin:0 0 20px; font-size:18px; }
    .card button { border:0; padding:13px 18px; border-radius:12px; background:var(--cream); color:var(--ink); font-weight:900; cursor:pointer; }
    @media (max-width:600px) { main { border-radius:0; border:0; } .machine{left:3%;transform:scale(.78);transform-origin:bottom left}.door{right:4%;transform:scale(.78);transform-origin:bottom right}.help{max-width:210px}.status{display:none} }
  </style>
</head>
<body>
  <main aria-label="NEST ESCAPE prototype game">
    <div class="stars"></div>
    <header><div><h1>NEST ESCAPE</h1><p class="sub">After Hours · Room 01: Claw Chaos</p></div><div class="status" id="status">Find the neon exit<br><b>Don’t touch the claw.</b></div></header>
    <section id="room">
      <div class="machine"><div class="claw"></div></div>
      <div class="door" aria-label="Exit door"></div>
      <div class="floor"></div>
      <div id="player" aria-label="Player"><div class="head"></div><div class="body"></div></div>
    </section>
    <div class="bubble" id="bubble">The arcade locked up. Reach the exit before the claw gives you an unwanted hug.</div>
    <div class="help">Move: <b>← →</b> or <b>A D</b> · Restart: <b>R</b></div>
    <button class="restart" id="restart">Restart</button>
    <div class="won" id="won"><div class="card"><h2>YOU ESCAPED!</h2><p>The claw machine has filed a strongly worded complaint.</p><button id="playAgain">Play again</button></div></div>
  </main>
<script>
  const player = document.querySelector(’#player’);
  const machine = document.querySelector(’.machine’);
  const door = document.querySelector(’.door’);
  const bubble = document.querySelector(’#bubble’);
  const won = document.querySelector(’#won’);
  const room = document.querySelector(’main’);
  let x = 7, active = true;
  const clamp = (n,min,max)=>Math.max(min,Math.min(max,n));
  function setPlayer(){ player.style.left = x + ’%’; }
  function reset(message=’Back to the start. The claw looks pleased.’) { x=7; active=true; won.classList.remove(’show’); bubble.textContent=message; setPlayer(); }
  function intersects(a,b){ const A=a.getBoundingClientRect(), B=b.getBoundingClientRect(); return A.left<B.right-12 && A.right>B.left+12 && A.top<B.bottom-8 && A.bottom>B.top+8; }
  function move(direction){ if(!active) return; x=clamp(x+direction*2.1, 3, 91); setPlayer();
    if(intersects(player,machine)){ active=false; player.style.filter=’brightness(2) saturate(.2)’; bubble.textContent=’CLAWED. Press R or Restart. It was not personal. Probably.’; setTimeout(()=>player.style.filter=’’,180); return; }
    if(intersects(player,door)){ active=false; bubble.textContent=’Exit found.’; won.classList.add(’show’); }
  }
  addEventListener(’keydown’, e=>{ if([’ArrowLeft’,’a’,’A’].includes(e.key)) move(-1); if([’ArrowRight’,’d’,’D’].includes(e.key)) move(1); if([’r’,’R’].includes(e.key)) reset(); });
  let held; addEventListener(’keydown’,e=>{ if((e.key===’ArrowLeft’||e.key===’a’||e.key===’A’)&&!held) held=setInterval(()=>move(-1),70); if((e.key===’ArrowRight’||e.key===’d’||e.key===’D’)&&!held) held=setInterval(()=>move(1),70); });
  addEventListener(’keyup’,()=>{clearInterval(held);held=null});
  room.addEventListener(’pointerdown’,e=>{ if(e.target.closest(’button’)) return; move(e.clientX < innerWidth/2 ? -1 : 1); });
  document.querySelector(’#restart’).onclick=()=>reset(’Fresh attempt. Avoid the claw, reach EXIT.’);
  document.querySelector(’#playAgain’).onclick=()=>reset(’Fresh attempt. Avoid the claw, reach EXIT.’);
  setPlayer();
</script>
</body>
</html>
